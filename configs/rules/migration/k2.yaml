        temp_table_name_suffix: _bk
        action: skip
    history_table:
        temp_table_name_suffix: _bf
        action: skip
    new_write_table:
        temp_table_name_suffix: _nw
        action: skip
    unchange_table:
        temp_table_name_suffix: _od
        action: skip


